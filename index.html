<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار الفصل الأول: المعلومات والوسائط وأخلاقيات المعلومات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#14213d;--mute:#5b6b88;--line:#cdd8ec;--accent:#2457d6;--accent-ink:#fff;--ok:#0f7b4d;--okbg:#dff5ea;--bad:#b3261e;--badbg:#fde4e2;--sel:#e3ebff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#e8eefc;--mute:#9fb0d0;--line:#2b3a5c;--accent:#7aa2ff;--accent-ink:#0f1626;--ok:#6fe0a8;--okbg:#12382a;--bad:#ff8f87;--badbg:#44201e;--sel:#243660}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--ink:#e8eefc;--mute:#9fb0d0;--line:#2b3a5c;--accent:#7aa2ff;--accent-ink:#0f1626;--ok:#6fe0a8;--okbg:#12382a;--bad:#ff8f87;--badbg:#44201e;--sel:#243660}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8;font-size:17px}
main{max-width:720px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:1.35rem;margin:6px 0 2px;font-weight:800}
.sub{color:var(--mute);margin:0 0 14px;font-size:.95rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.tag{display:inline-block;font-size:.85rem;font-weight:600;color:var(--accent);border:1.5px solid var(--accent);border-radius:99px;padding:0 12px;margin-bottom:8px}
.q{font-size:1.15rem;font-weight:600;margin:4px 0 14px}
.opt{display:block;width:100%;text-align:right;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){background:var(--sel);border-color:var(--accent)}
.opt:focus-visible,select:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.tfrow{display:flex;gap:10px}.tfrow .opt{text-align:center;margin:0;font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0;flex-wrap:wrap}
select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%}
select.ok{border-color:var(--ok);background:var(--okbg)}select.bad{border-color:var(--bad);background:var(--badbg)}
.fill{line-height:2.6}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.98rem}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.fb span{color:var(--ink)}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 22px;cursor:pointer;margin-top:14px}
.btn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.hide{display:none}
.score{font-size:2.4rem;font-weight:800;margin:0}
.types{list-style:none;padding:0;margin:12px 0}
.types li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
</style>
</head>
<body>
<main>
<h1>اختبر نفسك: المعلومات والوسائط وأخلاقيات المعلومات</h1>
<p class="sub">الفصل الأول: دراسة المعلومات (1-1 و 2-1). اختر الإجابة وشوف الشرح فورًا.</p>
<div class="bar"><i id="bar"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<div id="stage"></div>
</main>
<script>
const T={mcq:'اختيار من متعدد',tf:'صح أو خطأ',match:'توصيل',fill:'أكمل الفراغ'};
const ALL=[
{t:'mcq',q:'ما المصطلح الذي يطلق على الحقائق الممثلة بالأرقام أو الأحرف أو الرموز؟',o:['المعلومات','البيانات','المعرفة','الوسائط'],a:1,e:'البيانات (Data) حقائق تمثل بالأرقام أو الأحرف أو الرموز، وعندما يكون لها معنى يستخدم في اتخاذ القرار تصبح معلومات.'},
{t:'mcq',q:'بمجرد إنشاء المعلومات لا يمكن محوها بالكامل. أي خاصية هذه؟',o:['الاستمرارية','قابلية التكرار','الانتشار','الثقافة الإعلامية'],a:0,e:'هذه خاصية الاستمرارية (Persistence).'},
{t:'mcq',q:'يمكن نسخ الأفلام والموسيقى بكميات كبيرة دون تدهور في الجودة. أي خاصية هذه؟',o:['الاستمرارية','الانتشار','قابلية التكرار','المعرفة'],a:2,e:'قابلية التكرار (Reproducibility): إمكانية نسخ المعلومات بسهولة بكميات كبيرة.'},
{t:'mcq',q:'تنتشر المعلومات بسهولة عبر الصحف والتلفزيون والإنترنت. أي خاصية هذه؟',o:['الانتشار','الاستمرارية','قابلية التكرار','التحقق المتبادل'],a:0,e:'الانتشار (Propagation) عبر وسائل الإعلام الجماهيرية (Mass Media).'},
{t:'mcq',q:'المعلومات التي تم تحليلها وتنظيمها بشكل منهجي للمساعدة في حل المشكلات تسمى:',o:['البيانات','الوسائط','المعرفة','الشائعات'],a:2,e:'المعرفة (Knowledge) هي معلومات تم تحليلها وتنظيمها بشكل منهجي.'},
{t:'mcq',q:'أي مما يلي يعتبر معلومات أولية؟',o:['كتاب في المكتبة','خبر في صحيفة','برنامج في التلفزيون','نتائج استطلاع أجريته بنفسك'],a:3,e:'المعلومات الأولية تحصل عليها بنفسك مباشرة (تجارب، استطلاعات، استبيانات).'},
{t:'mcq',q:'مقارنة المعلومات من مصادر متعددة لتحديد دقتها وموثوقيتها تسمى:',o:['التحقق المتبادل','الجريمة الإلكترونية','العلامة الجغرافية','الاستمرارية'],a:0,e:'التحقق المتبادل (Cross-checking)، وهو مهم لأن المعلومات الثانوية قد تختلف عن الأصلية.'},
{t:'mcq',q:'القدرة على تفسير المعلومات التي تم الحصول عليها من الوسائط بدقة هي:',o:['الثقافة الإعلامية','أخلاقيات المعلومات','الهندسة الاجتماعية','وسائل التعبير'],a:0,e:'الثقافة الإعلامية (Media literacy).'},
{t:'mcq',q:'معلومات خطوط الطول والعرض المضمنة في الصور ومقاطع الفيديو تسمى:',o:['حقوق المؤلف','العلامة الجغرافية','المعلومات الشخصية','الاستمرارية'],a:1,e:'العلامة الجغرافية (Geotagging)، وخطرها أنها قد تكشف موقع منزلك.'},
{t:'mcq',q:'قيام شخص بانتحال شخصية فرد لسرقة هويته أو كلمات مروره يسمى:',o:['إدمان الإنترنت','انتحال الشخصية','التنمر الإلكتروني','تسريب المعلومات'],a:1,e:'انتحال الشخصية (Identity theft).'},

{t:'tf',q:'الكتب والصحف والتلفزيون أمثلة على المعلومات الثانوية.',a:true,e:'المعلومات الثانوية لا تحصل عليها بنفسك مباشرة، بل من طرف ثالث.'},
{t:'tf',q:'المعلومات المنشورة على الإنترنت تختفي بسهولة.',a:false,e:'خطأ. المعلومات تنتشر بسهولة وبمجرد انتشارها لا تختفي بسهولة.'},
{t:'tf',q:'يجوز مشاركة صور أو فيديوهات يحتفظ الآخرون بحقوق المؤلف عليها بدون إذن.',a:false,e:'خطأ. لا يجوز مشاركتها دون إذن لأنها محمية بحقوق المؤلف (copyright).'},
{t:'tf',q:'يمكنك الكتابة بحرية على لوحة إعلانات مجهولة لأنه لا أحد يعرف من كتب.',a:false,e:'خطأ. أخلاقيات المعلومات تنطبق دائمًا حتى لو كنت مجهولًا، فلا تنشر تعليقات تشهير بالآخرين.'},
{t:'tf',q:'وسائل التواصل الاجتماعي خدمات توفر منصات يتواصل فيها الأفراد عبر الإنترنت.',a:true,e:'صحيح. هذا هو تعريف وسائل التواصل الاجتماعي (Social media).'},
{t:'tf',q:'استخدام الهاتف الذكي أثناء المشي من المشاكل المرتبطة بالهواتف الذكية.',a:true,e:'صحيح. وهو من المشاكل مثل إدمان الإنترنت والجريمة الإلكترونية.'},

{t:'match',q:'وصّل كل مثال بنوع الوسيط المناسب:',items:['النص','التلفزيون','قرص DVD','الصوت','الراديو','محرك أقراص USB'],opts:['وسائل التعبير','وسائل النقل/الإرسال','وسائل التسجيل'],a:[0,1,2,0,1,2],e:'التعبير: نص، صور، صوت، فيديو. النقل: تلفزيون، راديو، صحف، كتب، هاتف، إنترنت. التسجيل: ورق، USB، DVD، تخزين سحابي.'},
{t:'match',q:'وصّل كل وصف بالمصطلح المناسب:',items:['الانغماس المفرط في الإنترنت لدرجة تعطيل الحياة اليومية','إساءة استخدام الكمبيوتر والشبكات في أنشطة إجرامية','معلومات كاذبة تنشر عمدًا أو بلا أساس','نشر تعليقات تشهير بالآخرين'],opts:['إدمان الإنترنت','الجريمة الإلكترونية','المعلومات المضللة والشائعات','التنمر الإلكتروني'],a:[0,1,2,3],e:'راجع التعريفات في الجزء ب من 2-1 وفي أخلاقيات المعلومات.'},

{t:'fill',q:'المعلومات ___ هي التي تحصل عليها بنفسك مباشرة، مثل نتائج الاستطلاعات والتجارب.',bank:['الأولية','الثانوية','المضللة'],a:[0],e:'الأولية: من التجربة الشخصية المباشرة أو البحث.'},
{t:'fill',q:'وسائل ___ هي الوسائط المستخدمة لتسجيل المعلومات وتخزينها، وتشمل ___ مثل USB وDVD.',bank:['التسجيل','التعبير','الانتشار','أقراص التخزين'],a:[0,3],e:'وسائل التسجيل (Recording media) أمثلتها الورق وUSB وDVD والتخزين السحابي.'},
{t:'fill',q:'___ هي المفاهيم والتوجيهات الأساسية للقيام بأنشطة مناسبة في مجتمع المعلومات، بغض النظر عن وجود ___.',bank:['أخلاقيات المعلومات','القوانين','العلامة الجغرافية','الاستمرارية'],a:[0,1],e:'أخلاقيات المعلومات (Information Ethics) تنطبق حتى لو لم توجد قوانين.'}
];
ALL.forEach((q,n)=>q.l=[0,1,2,3,4,5,6,7,10,11,16,18,19].includes(n)?'1':'2');
const M=(l,q,o,a,e)=>({t:'mcq',l,q,o,a,e}),F=(l,q,a,e)=>({t:'tf',l,q,a,e}),X=(l,q,items,opts,a,e)=>({t:'match',l,q,items,opts,a,e}),B=(l,q,bank,a,e)=>({t:'fill',l,q,bank,a,e});
ALL.push(
M('1','ما الفرق بين المعلومات والبيانات؟',['المعلومات لها معنى أو قيمة تستخدم في اتخاذ القرار','البيانات لها شكل مادي والمعلومات ليس لها','لا يوجد فرق بينهما','المعلومات أرقام فقط'],0,'البيانات حقائق خام، أما المعلومات فلها معنى أو قيمة يستخدمها المتلقي لاتخاذ القرار، وعلى عكس الأشياء المادية ليس لها شكل أو كيان ثابت.'),
M('1','أي مما يلي يعتبر معلومات ثانوية؟',['تقرير تجربة أجريتها بنفسك','نتائج استبيان وزعته على زملائك','مقال في صحيفة عن موضوع ما','جدول نتائج بحث قمت به'],2,'المعلومات الثانوية تحصل عليها من طرف ثالث مثل الكتب والصحف والتلفزيون.'),
M('1','لماذا نحتاج إلى التحقق المتبادل؟',['لأن المعلومات الثانوية قد تختلف عن الأصلية أو تحتوي على تفسيرات إضافية','لأن المعلومات الأولية دائمًا خاطئة','لتسريع نسخ المعلومات','لحذف المعلومات نهائيًا'],0,'نقارن المعلومات من مصادر متعددة لتحديد دقتها وموثوقيتها.'),
M('1','أي مما يلي من وسائل النقل/الإرسال؟',['النص والصور','الراديو والصحف','محركات USB','أقراص DVD'],1,'وسائل النقل: التلفزيون، الراديو، الصحف، الكتب، الهاتف، الإنترنت.'),
M('1','الصور والصوت والفيديو من أنواع:',['وسائل التسجيل','وسائل النقل','وسائل التعبير','المعلومات الأولية'],2,'وسائل التعبير (Expression media): النص، الصور، الصوت، الفيديو.'),
F('1','للمعلومات شكل مادي ملموس مثل الأشياء المادية.',false,'خطأ. على عكس الأشياء المادية، ليس للمعلومات شكل أو كيان ثابت.'),
F('1','النص والصور والفيديو من وسائل التسجيل.',false,'خطأ. هذه وسائل التعبير، أما وسائل التسجيل فمثل USB وDVD والتخزين السحابي.'),
F('1','المعلومات الأولية تحصل عليها من خلال طرف ثالث.',false,'خطأ. الأولية تحصل عليها بنفسك مباشرة، أما الثانوية فمن طرف ثالث.'),
F('1','الراديو والهاتف والإنترنت من وسائل النقل/الإرسال.',true,'صحيح. هي وسائط تستخدم لنقل المعلومات وتبادلها.'),
X('1','وصّل كل وصف بالخاصية المناسبة:',['لا يمكن محو المعلومات بالكامل','نسخ المعلومات بسهولة بكميات كبيرة','نشر المعلومات بسهولة عبر الإعلام والإنترنت'],['الاستمرارية','قابلية التكرار','الانتشار'],[0,1,2],'الخصائص الثلاث للمعلومات: الاستمرارية، قابلية التكرار، الانتشار.'),
X('1','صنّف كل مثال: معلومات أولية أم ثانوية؟',['تقارير التجارب','الكتب','نتائج الاستطلاعات','الصحف'],['معلومات أولية','معلومات ثانوية'],[0,1,0,1],'الأولية: تجارب واستطلاعات واستبيانات. الثانوية: كتب وصحف وتلفزيون.'),
B('1','عملية مقارنة المعلومات من مصادر متعددة لتحديد دقتها تسمى ___.',['التحقق المتبادل','الانتشار','الاستمرارية'],[0],'التحقق المتبادل (Cross-checking).'),
B('1','الصحف والتلفزيون والإنترنت تسمى وسائل الإعلام ___.',['الجماهيرية','التعبيرية','الثانوية'],[0],'وسائل الإعلام الجماهيرية (Mass Media) تنشر المعلومات بسهولة.'),
M('2','أي سلوك مناسب لأخلاقيات المعلومات عند نشر صورة؟',['نشر صورة شخص آخر دون إذنه','أخذ إذن صاحب الصورة قبل نشرها','نشر صورة محمية بحقوق المؤلف','نشر تعليق ساخر عن شخص'],1,'لا يجوز مشاركة صور أو فيديوهات يمتلكها الآخرون دون الحصول على إذن.'),
M('2','الانخراط في نشر تعليقات تشهير بالآخرين على الإنترنت يسمى:',['إدمان الإنترنت','التنمر الإلكتروني','الجريمة الإلكترونية','العلامة الجغرافية'],1,'التنمر الإلكتروني (Cyber bullying).'),
M('2','حالة الانغماس المفرط في الإنترنت لدرجة تعطيل الحياة اليومية هي:',['إدمان الإنترنت','انتحال الشخصية','الهندسة الاجتماعية','الاستمرارية'],0,'إدمان الإنترنت (Internet addiction).'),
M('2','أي تصرف مناسب لأخلاقيات استخدام الهاتف الذكي؟',['تشغيله أثناء قيادة السيارة','إيقاف تشغيله في السينما أو المتاحف','استخدامه أثناء المشي في الشارع','نشر تعليقات سلبية عن الآخرين'],1,'استخدام الهاتف في أماكن مثل السينما والمتاحف يزعج الآخرين، وأثناء القيادة أو المشي خطر.'),
M('2','معلومات كاذبة يتم نشرها عمدًا أو شائعات لا أساس لها تسمى:',['المعلومات المضللة والشائعات','المعلومات الأولية','حقوق المؤلف','وسائل التعبير'],0,'المعلومات المضللة والشائعات (Disinformation and rumors).'),
F('2','أخلاقيات المعلومات تنطبق حتى لو لم توجد قوانين تمنع التصرف.',true,'صحيح. حتى لو لم يكن الشيء محظورًا بقانون، يجب الامتناع عن السلوك غير اللائق.'),
F('2','مواقع الويب ملزمة قانونيًا بتقديم معلومات دقيقة دائمًا.',false,'خطأ. ليست ملزمة دائمًا، لذلك يجب أن تكون حذرًا وتتحقق من المعلومات.'),
F('2','لا يجب تسريب المعلومات الشخصية لشخص آخر على الإنترنت.',true,'صحيح. المعلومات الشخصية لها خصوصية يجب احترامها.'),
F('2','استخدام الهاتف الذكي أثناء قيادة السيارة تصرف مناسب.',false,'خطأ. هو تصرف خطير وغير أخلاقي.'),
X('2','وصّل كل وصف بالمصطلح المناسب:',['فعل استخدام الهاتف الذكي أثناء المشي','قيام شخص بانتحال شخصية فرد لسرقة هويته أو كلمات مروره','خدمات توفر منصات للتواصل عبر الإنترنت'],['استخدام الهاتف أثناء المشي','انتحال الشخصية','وسائل التواصل الاجتماعي'],[0,1,2],'راجع الجزء ب من الدرس 2-1.'),
B('2','لا يجوز نشر صور أو فيديوهات يحتفظ الآخرون بـ ___ عليها دون إذن.',['حقوق المؤلف','العلامة الجغرافية','انتحال الشخصية'],[0],'حقوق المؤلف (copyright).'),
B('2','___ في الصور قد تكشف موقع منزلك لأنها تتضمن خطوط الطول والعرض.',['العلامة الجغرافية','الشائعات','الجريمة الإلكترونية'],[0],'العلامة الجغرافية (Geotagging) خطر على خصوصيتك.')
);
let Q=ALL,mode='all',shufLast=false,i=0,score=0,done=false;const per={};const st=document.getElementById('stage');
function start(k,s){mode=k;shufLast=s;Q=k==='all'?[...ALL]:ALL.filter(q=>q.l===k);if(s)Q.sort(()=>Math.random()-.5);i=0;score=0;for(const x in per)delete per[x];show()}
function menu(){st.innerHTML='';for(const x in per)delete per[x];document.getElementById('bar').style.width='0';document.getElementById('cnt').textContent='اختر ما تريد حله';document.getElementById('sc').textContent='';
const c=$('<div class="card"><p class="q">تحب تحل إيه؟</p></div>');
[['1','الدرس 1-1: المعلومات والوسائط'],['2','الدرس 2-1: أخلاقيات المعلومات'],['all','الدرسين مع بعض']].forEach(([k,l])=>{const n=k==='all'?ALL.length:ALL.filter(q=>q.l===k).length;const b=$('<button class="opt"></button>');b.textContent=l+' ('+n+' سؤال)';b.onclick=()=>start(k,document.getElementById('shuf').checked);c.appendChild(b)});
c.appendChild($('<label class="sub"><input type="checkbox" id="shuf"> ترتيب الأسئلة عشوائي</label>'));st.appendChild(c)}
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
function head(){document.getElementById('bar').style.width=(i/Q.length*100)+'%';document.getElementById('cnt').textContent='سؤال '+Math.min(i+1,Q.length)+' من '+Q.length;document.getElementById('sc'). textContent='النتيجة: '+score}
function finish(ok,q,fbExtra){
  done=true;per[q.t]=per[q.t]||[0,0];per[q.t][1]++;if(ok){score++;per[q.t][0]++}
  const f=$('<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'إجابة صحيحة':'إجابة غير صحيحة')+'</b><span>'+q.e+'</span></div>');
  card.appendChild(f);
  const b=$('<button class="btn">'+(i===Q.length-1?'شوف النتيجة':'السؤال التالي')+'</button>');b.onclick=()=>{i++;show()};card.appendChild(b);b.focus();
  document.getElementById('sc').textContent='النتيجة: '+score;
}
let card;
function show(){
  done=false;st.innerHTML='';
  if(i>=Q.length)return result();
  head();const q=Q[i];
  card=$('<div class="card"><span class="tag">'+T[q.t]+'</span><p class="q"></p></div>');
  const qp=card.querySelector('.q');
  if(q.t==='mcq'){qp.textContent=q.q;q.o.forEach((o,k)=>{const b=$('<button class="opt"></button>');b.textContent=o;b.onclick=()=>{if(done)return;card.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok')});if(k!==q.a)b.classList.add('bad');finish(k===q.a,q)};card.appendChild(b)})}
  if(q.t==='tf'){qp.textContent=q.q;const r=$('<div class="tfrow"></div>');[['صح',true],['خطأ',false]].forEach(([l,v])=>{const b=$('<button class="opt"></button>');b.textContent=l;b.onclick=()=>{if(done)return;r.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if((j===0)===q.a)x.classList.add('ok')});if(v!==q.a)b.classList.add('bad');finish(v===q.a,q)};r.appendChild(b)});card.appendChild(r)}
  if(q.t==='match'||q.t==='fill'){
    const opts=q.t==='match'?q.opts:q.bank;const sels=[];
    const mk=()=>{const s=document.createElement('select');s.innerHTML='<option value="">اختر</option>'+opts.map((o,k)=>'<option value="'+k+'">'+o+'</option>').join('');sels.push(s);return s};
    if(q.t==='match'){qp.textContent=q.q;q.items.forEach(l=>{const r=$('<div class="row"><span></span></div>');r.firstChild.textContent=l;r.appendChild(mk());card.appendChild(r)})}
    else{const p=$('<p class="fill"></p>');q.q.split('___').forEach((part,k,arr)=>{p.appendChild(document.createTextNode(part));if(k<arr.length-1)p.appendChild(mk())});qp.replaceWith(p);
      const n=$('<p class="sub">اختر الكلمة المناسبة لكل فراغ.</p>');p.after(n)}
    const b=$('<button class="btn">تحقق من الإجابة</button>');
    b.onclick=()=>{if(done)return;if(sels.some(s=>s.value===''))return alert('لازم تختار إجابة لكل بند الأول.');let all=true;sels.forEach((s,k)=>{const ok=+s.value===q.a[k];if(!ok)all=false;s.classList.add(ok?'ok':'bad');if(!ok){s.title='الصحيح: '+opts[q.a[k]]}s.disabled=true});b.remove();
      if(!all){const c=$('<p class="sub"></p>');c.textContent='الإجابات الصحيحة: '+q.a.map(k=>opts[k]).join(' | ');card.appendChild(c)}
      finish(all,q)};
    card.appendChild(b)}
  st.appendChild(card);
}
function result(){
  document.getElementById('bar').style.width='100%';document.getElementById('cnt').textContent='انتهى الاختبار';
  const pct=Math.round(score/Q.length*100);
  const msg=pct>=85?'ممتاز! أنت متمكن من الفصل.':pct>=60?'كويس! راجع النقاط اللي غلطت فيها.':'محتاج مراجعة تانية للشرح، وبعدها جرب من جديد.';
  const c=$('<div class="card"><p class="score"></p><p></p><ul class="types"></ul></div>');
  c.querySelector('.score').textContent=score+' / '+Q.length;c.children[1].textContent=msg;
  const ul=c.querySelector('.types');Object.keys(T).forEach(k=>{if(per[k]){const li=document.createElement('li');li.innerHTML='<span>'+T[k]+'</span><span>'+per[k][0]+' / '+per[k][1]+'</span>';ul.appendChild(li)}});
  const b=$('<button class="btn">ابدأ من جديد</button>');b.textContent='أعد نفس الاختبار';b.onclick=()=>start(mode,shufLast);c.appendChild(b);const b2=$('<button class="btn alt">اختر قسمًا آخر</button>');b2.style.marginInlineStart='10px';b2.onclick=menu;c.appendChild(b2);st.appendChild(c);
}
menu();
</script>
</body>
